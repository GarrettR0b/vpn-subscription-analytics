name: vpn-subscription-analytics

services:
  postgres:
    image: postgres:16-alpine
    container_name: vpn_subscription_analytics_postgres
    environment:
      POSTGRES_DB: vpn_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d vpn_analytics"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - vpn_postgres_data:/var/lib/postgresql/data

volumes:
  vpn_postgres_data:
