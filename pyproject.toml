[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-saas-analytics"
version = "0.1.0"
description = "Data marts, product analytics and BI for a synthetic AI support SaaS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]
dev = [
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
generate-ai-saas-data = "ai_saas_analytics.generator:main"
load-ai-saas-data = "ai_saas_analytics.loader:main"
check-ai-saas-data = "ai_saas_analytics.data_quality:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
